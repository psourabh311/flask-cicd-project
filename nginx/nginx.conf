# Nginx Reverse Proxy Configuration
# Place this file at: /etc/nginx/sites-available/flask-app
# Enable with: ln -s /etc/nginx/sites-available/flask-app /etc/nginx/sites-enabled/

upstream flask_app {
    # Port is updated dynamically by deploy.sh during each deployment
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/flask_access.log;
    error_log  /var/log/nginx/flask_error.log;

    client_max_body_size 10M;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass         http://flask_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        # Suppress health check noise in access logs
        access_log off;
        proxy_pass       http://flask_app;
        proxy_set_header Host $host;
    }
}
