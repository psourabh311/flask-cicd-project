# Nginx Reverse Proxy Configuration
# Ye file EC2 pe /etc/nginx/sites-available/flask-app me jaayegi

# upstream block — backend servers define karo
# Agar multiple containers hote toh yahan sab list karte (load balancing)
# Abhi sirf ek container hai
upstream flask_app {
    # BLUE_PORT aur GREEN_PORT deploy.sh script me dynamically set honge
    # Abhi default 5000 hai
    server 127.0.0.1:5000;
}

server {
    # Port 80 pe HTTP traffic sun
    listen 80;
    
    # server_name — tumhara domain ya EC2 public IP
    # _ matlab koi bhi hostname accept karo (development ke liye)
    server_name _;

    # Access logs — har request log hogi
    access_log /var/log/nginx/flask_access.log;
    error_log /var/log/nginx/flask_error.log;

    # Client request size limit — large file uploads se protect karo
    client_max_body_size 10M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        # Sab requests Flask app ko forward karo
        proxy_pass http://flask_app;
        
        # Important headers — Flask ko pata chale real client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        # Health check endpoint — Nginx directly forward kare bina logging ke
        # access_log off: health checks logs me spam nahi karenge
        access_log off;
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
    }
}
