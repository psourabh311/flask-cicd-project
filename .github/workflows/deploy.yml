# GitHub Actions Workflow — CI/CD Pipeline
# Ye file define karti hai kya hoga jab main branch pe push hoga

name: CI/CD Pipeline

# TRIGGER: Kab ye workflow chalega?
on:
  push:
    branches:
      - main          # Sirf main branch pe push hone pe
  pull_request:
    branches:
      - main          # PR open hone pe bhi CI chalega (CD nahi)

# Environment variables jo saare jobs me available honge
env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app

jobs:
  # ============================================================
  # JOB 1: CI — Continuous Integration
  # Kaam: Code quality check + tests + Docker build verify
  # Ye job DONO pe chalega: push aur pull_request
  # ============================================================
  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest    # GitHub ka free Ubuntu runner use karo

    steps:
      # Step 1: Code checkout
      # actions/checkout@v4 — GitHub ka official action
      # Ye runner pe tumhara repository code download karta hai
      # Bina iske runner pe koi code nahi hoga
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Python setup
      # actions/setup-python@v5 — Python install karta hai runner pe
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'    # pip cache karo — faster builds

      # Step 3: Dependencies install karo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Flake8 lint — code quality check
      # Flake8 Python code me style issues aur syntax errors dhundta hai
      # E501: line too long (120 chars tak allow karo)
      # W503: line break before binary operator (ignore karo)
      - name: Lint with flake8
        run: |
          flake8 app/ --max-line-length=120 --ignore=W503 --exclude=app/tests/

      # Step 5: Tests run karo
      # -v: verbose output — kaunsa test pass/fail hua clearly dikhega
      # --tb=short: short traceback on failure
      - name: Run tests with pytest
        run: |
          python -m pytest app/tests/ -v --tb=short

      # Step 6: Docker build verify karo
      # Ye ensure karta hai ki Dockerfile correct hai
      # Image push nahi karenge abhi — sirf build verify
      # --no-push flag nahi hai, isliye build-push-action me push: false
      - name: Verify Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false    # Sirf build karo, push mat karo
          tags: ${{ env.IMAGE_NAME }}:test

  # ============================================================
  # JOB 2: CD — Continuous Deployment
  # Kaam: Docker Hub pe push + EC2 pe deploy
  # Ye job SIRF main branch pe push hone pe chalega
  # Pull requests pe nahi chalega (security ke liye)
  # ============================================================
  cd:
    name: CD - Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci    # CI job pass hone ke BAAD hi ye chalega
    
    # Sirf main branch pe push hone pe deploy karo
    # PR me ye job skip hoga
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Docker Hub login
      # docker/login-action@v3 — Docker Hub me login karta hai
      # secrets.DOCKER_USERNAME aur secrets.DOCKER_PASSWORD
      # GitHub Secrets me store hain — kabhi hardcode mat karo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Docker image build aur push karo
      # 2 tags push karenge:
      # 1. 'latest' — hamesha latest version point karta hai
      # 2. git SHA — exact commit ka reference (rollback ke liye useful)
      #    github.sha pehle 7 characters — short SHA
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 3: EC2 pe SSH karke deploy karo
      # appleboy/ssh-action@v1.0.0 — SSH action
      # Ye runner se EC2 pe SSH karta hai aur commands chalata hai
      # SSH_PRIVATE_KEY: tumhara EC2 ka .pem file content (GitHub Secret me)
      # EC2_HOST: tumhara EC2 public IP (GitHub Secret me)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # EC2 pe ye commands chalenge
            
            # Environment variable set karo deploy script ke liye
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export IMAGE_TAG="${{ github.sha }}"
            
            # deploy.sh script chalao
            # Ye script zero-downtime deployment karega
            bash /home/ubuntu/deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}

      # Step 4: Deployment verify karo
      # Deploy ke baad health check karo confirm karne ke liye
      - name: Verify deployment
        run: |
          echo "Waiting 20 seconds for deployment to stabilize..."
          sleep 20
          
          # EC2 ka health endpoint check karo
          # --max-time 30: 30 second timeout
          # --retry 3: 3 baar try karo
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            http://${{ secrets.EC2_HOST }}/health)
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deployment successful! Health check passed."
          else
            echo "❌ Deployment verification failed! HTTP Status: ${HTTP_STATUS}"
            echo "Check EC2 Security Group — port 80 open hona chahiye"
            exit 1
          fi
