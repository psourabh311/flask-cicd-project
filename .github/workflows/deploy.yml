name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app

jobs:
  # ============================================================
  # CI Job — runs on every push and pull request
  # Validates code quality, tests, and Docker build integrity
  # before any deployment is attempted
  # ============================================================
  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app/ --max-line-length=120 --ignore=W503 --exclude=app/tests/

      - name: Run tests with pytest
        run: |
          python -m pytest app/tests/ -v --tb=short

      - name: Verify Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:test

  # ============================================================
  # CD Job — runs only on push to main branch
  # Builds the production image, pushes to Docker Hub,
  # and deploys to EC2 using zero-downtime Blue-Green strategy
  # ============================================================
  cd:
    name: CD - Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export IMAGE_TAG="${{ github.sha }}"
            bash /home/ubuntu/deploy.sh

      - name: Verify deployment
        run: |
          echo "Waiting 20 seconds for deployment to stabilize..."
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            http://${{ secrets.EC2_HOST }}/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Deployment verified. Health check passed."
          else
            echo "Deployment verification failed. HTTP status: ${HTTP_STATUS}"
            exit 1
          fi
